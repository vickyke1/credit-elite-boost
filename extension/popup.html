<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Credit Elite Boost</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17l6-6 4 4 8-8" />
          <path d="M21 7v6h-6" />
        </svg>
      </div>
      <div class="brand">
        <h1>Credit Elite Boost</h1>
        <p>Boost your score, the smart way</p>
      </div>
    </header>

    <main class="content">
      <section class="card" aria-labelledby="calc-title">
        <h2 id="calc-title">Credit Utilization Calculator</h2>
        <p class="hint">Utilization is ~30% of your FICO score. Keep it under 30% (ideally under 10%).</p>

        <label class="field">
          <span>Total balances ($)</span>
          <input id="balance" type="number" inputmode="decimal" min="0" step="any" placeholder="2,500" />
        </label>

        <label class="field">
          <span>Total credit limits ($)</span>
          <input id="limit" type="number" inputmode="decimal" min="0" step="any" placeholder="10,000" />
        </label>

        <div class="result" id="result" role="status" aria-live="polite">
          <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
          <div class="result-row">
            <span class="util" id="utilValue">—</span>
            <span class="badge" id="utilBadge">Enter your numbers</span>
          </div>
          <p class="advice" id="advice"></p>
        </div>
      </section>

      <section class="links" aria-label="Quick links">
        <a class="link" data-path="/tradelines" href="#">🏦 Tradeline Marketplace</a>
        <a class="link" data-path="/calculator" href="#">🧮 Tradeline Calculator</a>
        <a class="link" data-path="/credit-repair" href="#">🛠️ Credit Repair</a>
        <a class="link" data-path="/blog" href="#">📚 Credit Guides &amp; Blog</a>
      </section>
    </main>

    <footer class="footer">
      <a class="cta" data-path="/" href="#">Open cpncreditboost.com →</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
